<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Точки забора заказов</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Точки забора">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --asphalt: #14171c;
    --asphalt-2: #1c2028;
    --card: #20242c;
    --line: #2c313c;
    --text: #eef0f3;
    --text-dim: #8b93a1;
    --signal: #ffb020;
    --signal-dim: #7a5619;
    --cold: #4fb6c9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--asphalt);color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;}
  #app{display:flex; flex-direction:column; height:100vh; max-width:520px; margin:0 auto;}

  header{padding:14px 16px 8px; flex-shrink:0;}
  h1{font-size:20px; font-weight:800; letter-spacing:-0.02em; margin:0 0 4px;}
  .sub{color:var(--text-dim); font-size:12.5px; margin:0; line-height:1.4;}

  #mapOuter{position:relative; margin:10px 14px; flex:1 1 auto; min-height:260px;
    border-radius:14px; overflow:hidden; border:1px solid var(--line);}
  #map{width:100%; height:100%; background:var(--asphalt-2);}

  #locateBtn{
    position:absolute; right:10px; top:10px; z-index:400; background:var(--card);
    border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 10px;
    font-size:16px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  #modeBadge{
    position:absolute; left:10px; top:10px; z-index:400; background:rgba(20,23,28,0.85);
    color:var(--text-dim); font-size:11px; padding:6px 10px; border-radius:8px;
    border:1px solid var(--line); pointer-events:none;
  }

  #placeSearchWrap{
    position:absolute; left:10px; right:54px; top:52px; z-index:450;
  }
  #placeSearchInput{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:rgba(32,36,44,0.95); color:var(--text); font-size:13px; outline:none;
    box-sizing:border-box; box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  #placeSearchInput:focus{border-color:var(--signal);}
  #placeSearchInput::placeholder{color:var(--text-dim);}
  #placeResults{
    margin-top:6px; background:var(--card); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; max-height:200px; overflow-y:auto; display:none;
    box-shadow:0 4px 14px rgba(0,0,0,0.5);
  }
  #placeResults.show{display:block;}
  .placeItem{
    padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:12.5px;
  }
  .placeItem:last-child{border-bottom:none;}
  .placeItem:active{background:var(--asphalt-2);}
  .placeItem .pName{font-weight:700; color:var(--text); margin-bottom:2px;}
  .placeItem .pAddr{color:var(--text-dim); font-size:11px;}
  .placeItem.empty{color:var(--text-dim); text-align:center; cursor:default;}

  .pinDiv{display:flex; align-items:center; justify-content:center; border-radius:50%;
    font-weight:800; color:#14171c; border:2px solid rgba(255,255,255,0.35);}

  #list{padding:2px 16px 6px; flex-shrink:0; max-height:30vh; overflow-y:auto;}
  #searchInput{
    width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--text); font-size:13.5px; outline:none;
    margin:4px 0 8px; box-sizing:border-box;
  }
  #searchInput:focus{border-color:var(--signal);}
  #searchInput::placeholder{color:var(--text-dim);}
  .listTitle{font-size:12px; color:var(--text-dim); margin:6px 2px 8px; display:flex; justify-content:space-between;}
  .row{display:flex; align-items:center; gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:7px;}
  .row .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .row .name{flex:1; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .n{font-size:12.5px; color:var(--text-dim); min-width:60px; text-align:right;}
  .row button{background:var(--signal-dim); color:var(--signal); border:none; border-radius:8px;
    width:28px; height:28px; font-size:15px; font-weight:700; cursor:pointer;}
  .row button.minus{background:#3a2020; color:var(--danger, #e85d5d);}
  .row .del{background:transparent; color:var(--text-dim); font-size:13px; width:22px;}
  .empty{color:var(--text-dim); font-size:13px; text-align:center; padding:16px 10px;}

  #modalBg{position:fixed; inset:0; background:rgba(10,12,15,0.7); display:none;
    align-items:flex-end; justify-content:center; z-index:1000;}
  #modalBg.show{display:flex;}
  #modal{background:var(--card); width:100%; max-width:520px; border-radius:16px 16px 0 0;
    padding:20px; border-top:1px solid var(--line);}
  #modal h3{margin:0 0 6px; font-size:15px;}
  #modal .coords{color:var(--text-dim); font-size:11.5px; margin:0 0 12px;}
  #modal input{width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--asphalt-2); color:var(--text); font-size:15px; outline:none;}
  #modal input:focus{border-color:var(--signal);}
  #modalBtns{display:flex; gap:10px; margin-top:14px;}
  #modalBtns button{flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:700; cursor:pointer;}
  #cancelBtn{background:var(--line); color:var(--text);}
  #saveBtn{background:var(--signal); color:#14171c;}

  #resetLink{text-align:center; padding-bottom:12px; flex-shrink:0;}
  #resetLink a{color:var(--text-dim); font-size:11.5px; text-decoration:underline; cursor:pointer;}

  #placeSearchWrap{position:relative; margin:8px 14px 0; flex-shrink:0;}
  #placeSearchInput{
    width:100%; box-sizing:border-box; padding:10px 36px 10px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--text);
    font-size:14px; outline:none;
  }
  #placeSearchInput:focus{border-color:var(--signal);}
  #placeSearchInput::placeholder{color:var(--text-dim);}
  #placeSearchClear{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text-dim); font-size:16px; cursor:pointer; display:none;
  }
  #placeSearchClear.show{display:block;}
  #placeResults{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:900;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    max-height:260px; overflow-y:auto; box-shadow:0 8px 20px rgba(0,0,0,0.4); display:none;
  }
  #placeResults.show{display:block;}
  .placeItem{padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line);}
  .placeItem:last-child{border-bottom:none;}
  .placeItem:active{background:var(--asphalt-2);}
  .placeItem .pName{font-size:13.5px; font-weight:600; color:var(--text);}
  .placeItem .pAddr{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .placeLoading, .placeEmpty{padding:12px; font-size:12.5px; color:var(--text-dim); text-align:center;}

  .leaflet-control-attribution{font-size:9px; background:rgba(20,23,28,0.7)!important; color:var(--text-dim)!important;}
  .leaflet-control-attribution a{color:var(--text-dim)!important;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Точки забора</h1>
    <p class="sub">Тапни рядом с заведением на карте — если точка уже есть в радиусе ~40м, забор просто засчитается ей, иначе создастся новая.</p>
  </header>

  <div id="placeSearchWrap">
    <input id="placeSearchInput" type="text" placeholder="Найти заведение или адрес..." oninput="onPlaceSearchInput(event)">
    <button id="placeSearchClear" onclick="clearPlaceSearch()">✕</button>
    <div id="placeResults"></div>
  </div>

  <div id="mapOuter">
    <div id="map"></div>
    <div id="modeBadge">Обычная карта</div>
    <button id="locateBtn" title="Найти меня">📍</button>
    <div id="placeSearchWrap">
      <input id="placeSearchInput" type="text" placeholder="🔍 Найти заведение на карте..." autocomplete="off">
      <div id="placeResults"></div>
    </div>
  </div>

  <div id="list">
    <input id="searchInput" type="text" placeholder="Поиск среди своих точек..." oninput="renderAll()">
    <div class="listTitle"><span>По частоте</span><span id="totalCount"></span></div>
    <div id="rows"></div>
  </div>

  <div id="resetLink"><a onclick="resetAll()">Очистить все данные</a></div>
</div>

<div id="modalBg">
  <div id="modal">
    <h3>Как называется заведение?</h3>
    <p class="coords" id="coordsText"></p>
    <input id="nameInput" type="text" placeholder="Например: Вкусно и точка" maxlength="40">
    <div id="modalBtns">
      <button id="cancelBtn" onclick="closeModal()">Отмена</button>
      <button id="saveBtn" onclick="saveNewSpot()">Добавить</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'pickup-spots-geo';
const CLUSTER_RADIUS_M = 40; // если тап ближе этого расстояния к точке - засчитываем ей же
let spots = [];
let pendingLatLng = null;
let markers = {}; // id -> leaflet marker

// Стартовая точка - примерное местоположение, потом попробуем уточнить через GPS браузера
const DEFAULT_CENTER = [39.49061425228292, -0.34876301013819333];

const map = L.map('map', { zoomControl: true, attributionControl: true })
  .setView(DEFAULT_CENTER, 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

// затемняем тайлы под тёмную тему интерфейса
document.getElementById('map').style.filter = 'invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9)';

function distMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function colorForCount(count, max){
  const t = max <= 1 ? 0 : Math.min(1, (count - 1) / (max - 1 || 1));
  const c1 = [79, 182, 201], c2 = [255, 176, 32];
  const r = Math.round(c1[0] + (c2[0]-c1[0])*t);
  const g = Math.round(c1[1] + (c2[1]-c1[1])*t);
  const b = Math.round(c1[2] + (c2[2]-c1[2])*t);
  return `rgb(${r},${g},${b})`;
}
function sizeForCount(count, max){
  const t = max <= 1 ? 0 : Math.min(1, (count - 1) / (max - 1 || 1));
  return 24 + t * 28;
}

function makeIcon(spot, max){
  const size = sizeForCount(spot.count, max);
  const color = colorForCount(spot.count, max);
  const html = `<div class="pinDiv" style="width:${size}px;height:${size}px;background:${color};box-shadow:0 0 ${size*0.5}px ${color}66;font-size:${size*0.4}px;">${spot.count}</div>`;
  return L.divIcon({ html, className: '', iconSize: [size, size], iconAnchor: [size/2, size/2] });
}

function loadSpots(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    spots = raw ? JSON.parse(raw) : [];
  }catch(e){ spots = []; }
  renderAll();
  if(spots.length){
    const group = L.featureGroup(Object.values(markers));
    try{ map.fitBounds(group.getBounds().pad(0.3)); }catch(e){}
  }
}

function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(spots)); }
  catch(e){ console.error('storage error', e); }
}

function renderAll(){
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  const max = spots.reduce((m,s) => Math.max(m, s.count), 1);

  spots.forEach(s => {
    const marker = L.marker([s.lat, s.lng], { icon: makeIcon(s, max) }).addTo(map);
    marker.bindTooltip(s.name, { direction: 'top', offset: [0, -8] });
    marker.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      bump(s.id);
    });
    markers[s.id] = marker;
  });

  const sorted = [...spots].sort((a,b) => b.count - a.count);
  const rowsEl = document.getElementById('rows');
  const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  const filtered = query ? sorted.filter(s => s.name.toLowerCase().includes(query)) : sorted;

  if(sorted.length === 0){
    rowsEl.innerHTML = '<div class="empty">Пока пусто. Тапни по карте, где обычно забираешь заказы.</div>';
  } else if(filtered.length === 0){
    rowsEl.innerHTML = '<div class="empty">Ничего не найдено по запросу «' + escapeHtml(query) + '»</div>';
  } else {
    rowsEl.innerHTML = filtered.map(s => `
      <div class="row">
        <div class="dot" style="background:${colorForCount(s.count, max)}"></div>
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="n">${s.count} раз${plural(s.count)}</div>
        <button class="minus" onclick="unbump('${s.id}')">−1</button>
        <button onclick="bump('${s.id}')">+1</button>
        <button class="del" onclick="removeSpot('${s.id}')">✕</button>
      </div>
    `).join('');
  }
  const total = spots.reduce((a,s) => a + s.count, 0);
  document.getElementById('totalCount').textContent = total ? `всего заборов: ${total}` : '';
}

function plural(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10 === 1 && mod100 !== 11) return '';
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'а';
  return '';
}
function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}

function bump(id){
  const s = spots.find(s => s.id === id);
  if(!s) return;
  s.count += 1;
  s.lastVisit = new Date().toISOString();
  persist();
  renderAll();
}

function unbump(id){
  const s = spots.find(s => s.id === id);
  if(!s) return;
  if(s.count <= 1){
    // если счётчик уже 1, спрашиваем удалить точку целиком
    if(confirm('Это последний забор в этой точке. Удалить точку полностью?')){
      removeSpot(id);
    }
    return;
  }
  s.count -= 1;
  persist();
  renderAll();
}

function removeSpot(id){
  spots = spots.filter(s => s.id !== id);
  persist();
  renderAll();
}

map.on('click', (e) => {
  const { lat, lng } = e.latlng;
  // ищем ближайшую существующую точку в радиусе кластеризации
  let nearest = null, nearestDist = Infinity;
  spots.forEach(s => {
    const d = distMeters(lat, lng, s.lat, s.lng);
    if(d < nearestDist){ nearestDist = d; nearest = s; }
  });
  if(nearest && nearestDist <= CLUSTER_RADIUS_M){
    bump(nearest.id);
    return;
  }
  pendingLatLng = { lat, lng };
  openModal(lat, lng);
});

// --- Поиск реальных заведений/адресов через Nominatim (OpenStreetMap), бесплатно, без ключей ---
let placeSearchTimer = null;
let placeSearchAbort = null;

function onPlaceSearchInput(e){
  const q = e.target.value.trim();
  document.getElementById('placeSearchClear').classList.toggle('show', q.length > 0);
  clearTimeout(placeSearchTimer);
  if(q.length < 3){
    hidePlaceResults();
    return;
  }
  showPlaceLoading();
  // Nominatim просит не чаще 1 запроса в секунду - ждём паузу в наборе текста
  placeSearchTimer = setTimeout(() => runPlaceSearch(q), 600);
}

function clearPlaceSearch(){
  document.getElementById('placeSearchInput').value = '';
  document.getElementById('placeSearchClear').classList.remove('show');
  hidePlaceResults();
}

function showPlaceLoading(){
  const box = document.getElementById('placeResults');
  box.innerHTML = '<div class="placeLoading">Ищу...</div>';
  box.classList.add('show');
}

function hidePlaceResults(){
  const box = document.getElementById('placeResults');
  box.classList.remove('show');
  box.innerHTML = '';
}

async function runPlaceSearch(query){
  if(placeSearchAbort) placeSearchAbort.abort();
  placeSearchAbort = new AbortController();
  try{
    const center = map.getCenter();
    // немного смещаем поиск в сторону текущей области карты, но не ограничиваем страной/регионом жёстко
    const viewbox = [center.lng-0.15, center.lat+0.15, center.lng+0.15, center.lat-0.15].join(',');
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=6&addressdetails=1&accept-language=ru&viewbox=${viewbox}`;
    const res = await fetch(url, { signal: placeSearchAbort.signal });
    const data = await res.json();
    renderPlaceResults(data);
  }catch(e){
    if(e.name !== 'AbortError'){
      const box = document.getElementById('placeResults');
      box.innerHTML = '<div class="placeEmpty">Не получилось найти. Проверь интернет.</div>';
      box.classList.add('show');
    }
  }
}

function renderPlaceResults(results){
  const box = document.getElementById('placeResults');
  if(!results || results.length === 0){
    box.innerHTML = '<div class="placeEmpty">Ничего не найдено</div>';
    box.classList.add('show');
    return;
  }
  box.innerHTML = results.map((r, i) => {
    const shortName = (r.display_name || '').split(',')[0];
    const rest = (r.display_name || '').split(',').slice(1, 4).join(',').trim();
    return `<div class="placeItem" data-idx="${i}">
      <div class="pName">${escapeHtml(shortName)}</div>
      <div class="pAddr">${escapeHtml(rest)}</div>
    </div>`;
  }).join('');
  box.classList.add('show');

  box.querySelectorAll('.placeItem').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx, 10);
      const r = results[idx];
      const lat = parseFloat(r.lat), lng = parseFloat(r.lon);
      const shortName = (r.display_name || '').split(',')[0];
      map.setView([lat, lng], 17);
      hidePlaceResults();
      document.getElementById('placeSearchInput').value = '';
      document.getElementById('placeSearchClear').classList.remove('show');

      // как обычно: если рядом уже есть точка - засчитываем ей, иначе открываем создание новой с готовым названием
      let nearest = null, nearestDist = Infinity;
      spots.forEach(s => {
        const d = distMeters(lat, lng, s.lat, s.lng);
        if(d < nearestDist){ nearestDist = d; nearest = s; }
      });
      if(nearest && nearestDist <= CLUSTER_RADIUS_M){
        bump(nearest.id);
        return;
      }
      pendingLatLng = { lat, lng };
      openModal(lat, lng, shortName);
    });
  });
}

function openModal(lat, lng, prefillName){
  document.getElementById('nameInput').value = prefillName || '';
  document.getElementById('coordsText').textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  document.getElementById('modalBg').classList.add('show');
  setTimeout(() => {
    const input = document.getElementById('nameInput');
    input.focus();
    if(prefillName) input.select();
  }, 50);
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
  pendingLatLng = null;
}
function saveNewSpot(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name || !pendingLatLng){ closeModal(); return; }
  spots.push({
    id: 'spot_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    name,
    lat: pendingLatLng.lat,
    lng: pendingLatLng.lng,
    count: 1,
    lastVisit: new Date().toISOString()
  });
  persist();
  closeModal();
  renderAll();
}

function resetAll(){
  if(!confirm('Удалить все отметки?')) return;
  spots = [];
  persist();
  renderAll();
}

// регистрируем service worker для офлайн-работы (сработает только когда сайт открыт по HTTPS)
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

document.getElementById('nameInput')?.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') saveNewSpot();
});

document.getElementById('locateBtn').addEventListener('click', () => {
  if(!navigator.geolocation){ alert('Геолокация недоступна в этом браузере'); return; }
  document.getElementById('modeBadge').textContent = 'Ищу тебя...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      map.setView([latitude, longitude], 16);
      document.getElementById('modeBadge').textContent = 'Твоё местоположение';
      setTimeout(() => document.getElementById('modeBadge').textContent = 'Обычная карта', 2000);
    },
    (err) => {
      document.getElementById('modeBadge').textContent = 'Доступ к GPS не дан';
      setTimeout(() => document.getElementById('modeBadge').textContent = 'Обычная карта', 2000);
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

// пробуем сразу мягко получить геолокацию для более точного центра карты
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      if(spots.length === 0){
        map.setView([pos.coords.latitude, pos.coords.longitude], 15);
      }
    },
    () => {},
    { timeout: 4000 }
  );
}

loadSpots();
</script>
